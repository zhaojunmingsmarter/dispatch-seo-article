name: Local backend GSC refresh

# The backend's GitHub-hosted cron cannot reach this Mac's localhost.
# Match the upstream backend's every-three-hours cadence on the local runner.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: local-hourly-gsc
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'zhaojunmingsmarter/dispatch-seo-article' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: dispatchseo-local-health
    timeout-minutes: 6
    steps:
      - name: Run the local backend GSC cron
        env:
          CRON_SECRET: ${{ secrets.DISPATCHSEO_LOCAL_CRON_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$CRON_SECRET" ] || { echo '::error::Local backend cron secret is missing.'; exit 1; }
          curl --fail-with-body -sS --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            http://127.0.0.1:3000/api/cron/hourly-gsc > "$RUNNER_TEMP/gsc-refresh.json"
          jq -e '.www | type == "object"' "$RUNNER_TEMP/gsc-refresh.json" > /dev/null
          jq . "$RUNNER_TEMP/gsc-refresh.json"
          skipped=$(jq -r '.www.skipped // empty' "$RUNNER_TEMP/gsc-refresh.json")
          if [ -n "$skipped" ]; then
            echo "::warning::Cron endpoint completed, but GSC data refresh was skipped: $skipped"
          fi
